<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | Kurigram Connect</title>

    <link rel="stylesheet" href="../css/appointment.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<header class="header">

    <a href="../index.html" class="back">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <h2>Book Appointment</h2>

    <i class="fa-solid fa-calendar-check"></i>

</header>

<div class="container">

    <form id="appointmentForm">

        <input type="text" placeholder="Full Name" required>

        <input type="tel" placeholder="Mobile Number" required>

        <input type="number" placeholder="Age" required>

        <select required>
            <option>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
        </select>

        <select required>
            <option>Select Hospital</option>
            <option>Kurigram General Hospital</option>
            <option>Kurigram Medical Center</option>
            <option>Diabetic Hospital</option>
        </select>

        <select required>
            <option>Select Doctor</option>
            <option>Dr. Ahmed Hasan</option>
            <option>Dr. Rahman</option>
            <option>Dr. Karim</option>
        </select>

        <input type="date" required>

        <input type="time" required>

        <textarea placeholder="Describe your problem"></textarea>

        <button type="submit">
            Book Appointment
        </button>

    </form>

</div>

<script src="../js/appointment.js"></script>

</body>

</html>
