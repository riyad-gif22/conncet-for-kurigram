<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospitals | Kurigram Connect</title>

    <link rel="stylesheet" href="../css/hospital.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <!-- Header -->

    <header class="header">

        <a href="../index.html" class="back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <h2>Kurigram Hospitals</h2>

        <i class="fa-solid fa-hospital"></i>

    </header>

    <!-- Search -->

    <section class="search">

        <input type="text" placeholder="Search Hospital...">

    </section>

    <!-- Categories -->

    <section class="category">

        <button>All</button>
        <button>Government</button>
        <button>Private</button>
        <button>Clinic</button>

    </section>

    <!-- Hospital List -->

    <section class="hospital-list">

        <!-- Card 1 -->

        <div class="card">

            <img src="../image/hospitals/hospital1.jpg" alt="Hospital">

            <div class="info">

                <h3>Kurigram General Hospital</h3>

                <p>
                    <i class="fa-solid fa-location-dot"></i>
                    Kurigram Sadar
                </p>

                <p>
                    <i class="fa-solid fa-phone"></i>
                    01300000000
                </p>

                <p>
                    <i class="fa-solid fa-clock"></i>
                    Open 24 Hours
                </p>

                <div class="btn">

                    <a href="#">Call</a>

                    <a href="#">Map</a>

                    <a href="#">Details</a>

                </div>

            </div>

        </div>

        <!-- Card 2 -->

        <div class="card">

            <img src="../image/hospitals/hospital2.jpg" alt="Hospital">

            <div class="info">

                <h3>Kurigram Medical Center</h3>

                <p><i class="fa-solid fa-location-dot"></i> Kurigram</p>

                <p><i class="fa-solid fa-phone"></i> 01700000000</p>

                <p><i class="fa-solid fa-clock"></i> 24 Hours</p>

                <div class="btn">

                    <a href="#">Call</a>

                    <a href="#">Map</a>

                    <a href="#">Details</a>

                </div>

            </div>

        </div>

    </section>

    <!-- Footer -->

    <footer>

        <h3>Kurigram Connect</h3>

        <p>Designed & Developed by Md. Riyad Babu</p>

    </footer>

    <script src="../js/hospital.js"></script>

</body>

</html>
